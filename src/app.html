<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1 interactive-widget=resizes-content"
		/>
		<meta
			name="description"
			content="A quick and easy chilli cook-off voting app! Create events, invite friends, and let the voting begin!"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Unkempt-Bold.ttf"
			type="font/truetype"
			cas="font"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/ShortStack-Regular.ttf"
			type="font/truetype"
			cas="font"
			crossorigin
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/AveriaSansLibre-Regular.ttf"
			type="font/truetype"
			cas="font"
			crossorigin
		/>
		<script>
			<!-- Check dark mode preference before other parts of the page load -->
			(function () {
				const saved = localStorage.getItem('theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (saved === 'dark' || (!saved && prefersDark)) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="transition-colors duration-(--theme-duration) dark:bg-gray-800"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
